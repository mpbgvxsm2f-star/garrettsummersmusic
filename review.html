<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    color-scheme: dark light;
    --ink:#f1ead9;
    --ink-dim:#cfc5b0;
    --ground:#1c1815;
    --ground-raised:#27201c;
    --brass:#c99a4b;
    --rust:#a9573a;
    --line:#413a32;
    --mono: 'Space Mono', ui-monospace, monospace;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Work Sans', -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --ink:#201b17;
      --ink-dim:#4a4238;
      --ground:#ece3d0;
      --ground-raised:#fbf9f4;
      --brass:#8a5f27;
      --rust:#96492f;
      --line:#d8cbae;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16.5px;
    line-height:1.5;
    padding-inline:20px;
  }
  .wrap{max-width:1200px;margin:0 auto;padding-block:40px 80px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  h1{
    font-family:var(--serif);
    font-size:1.9rem;
    font-weight:700;
    margin:0 0 10px;
  }
  .lead{
    font-family:var(--sans);
    font-size:0.95rem;
    color:var(--ink-dim);
    margin:0 0 32px;
    max-width:640px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:10px;
  }
  .card{
    margin:0;
    background:var(--ground-raised);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    position:relative;
  }
  .card img{
    display:block;
    width:100%;
    height:180px;
    object-fit:cover;
    cursor:zoom-in;
  }
  .card figcaption{
    font-family:var(--mono);
    font-size:0.65rem;
    letter-spacing:0.04em;
    color:var(--ink-dim);
    padding:5px 8px;
    background:var(--ground-raised);
  }
  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:24px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:4px;}
  .lightbox .cap{
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink);
    background:rgba(0,0,0,0.6);
    padding:6px 12px;
    border-radius:4px;
  }
</style>
</head>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
    <div class="cap" id="lightboxCap"></div>
  </div>

  <script>
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightboxImg');
    var lbCap = document.getElementById('lightboxCap');
    document.querySelectorAll('.card img').forEach(function(img){
      img.addEventListener('click', function(){
        lbImg.src = img.src;
        lbCap.textContent = img.closest('.card').querySelector('figcaption').textContent;
        lb.classList.add('open');
      });
    });
    lb.addEventListener('click', function(){ lb.classList.remove('open'); lbImg.src=''; });
  </script>
