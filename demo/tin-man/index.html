<style>
  :root{
    color-scheme:dark light;
    --ink:#f1ead9; --ink-dim:#cfc5b0; --ground:#1c1815; --ground-raised:#27201c;
    --brass:#c99a4b; --rust:#a9573a; --line:#413a32;
    --mono:'Space Mono', ui-monospace, monospace;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Work Sans', -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --ink:#201b17; --ink-dim:#4a4238; --ground:#ece3d0; --ground-raised:#fbf9f4; --brass:#8a5f27; --rust:#96492f; --line:#d8cbae; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh; min-height:100dvh;
    background:var(--ground); color:var(--ink);
    font-family:var(--sans); line-height:1.5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
    position:relative; overflow-x:hidden;
  }
  /* Blurred, darkened cover as the room's lighting */
  .ambient{position:fixed; inset:-10%; z-index:-2; background:url('/images/tin-man-cover.jpg') center/cover; filter:blur(60px) brightness(0.35); transform:scale(1.1);}
  .scrim{position:fixed; inset:0; z-index:-1; background:radial-gradient(ellipse at center, transparent 0%, var(--ground) 85%); opacity:0.9;}
  @media (prefers-color-scheme: light){ .ambient{filter:blur(60px) brightness(1.1) grayscale(1); opacity:0.5;} .wave i:not(.on){background:rgba(32,27,23,0.22);} }

  main{width:100%; max-width:420px;}
  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .home{font-family:var(--mono); font-size:0.66rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-dim); text-decoration:none; display:flex; align-items:center; gap:10px;}
  .home::before{content:""; width:22px; height:1px; background:var(--rust);}
  .home:hover{color:var(--brass);}
  .badge{font-family:var(--mono); font-size:0.6rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass); border:1px solid var(--brass); border-radius:3px; padding:3px 8px;}

  .cover{position:relative; display:block; width:100%; aspect-ratio:1; padding:0; border:none; border-radius:14px; overflow:hidden; cursor:pointer; background:var(--ground-raised); box-shadow:0 30px 70px rgba(0,0,0,0.5); -webkit-appearance:none; appearance:none;}
  .cover img{width:100%; height:100%; object-fit:cover; display:block; transition:transform 8s ease, filter .4s ease;}
  .playing .cover img{transform:scale(1.06);}
  .cover:focus-visible{outline:2px solid var(--brass); outline-offset:4px;}
  .play{position:absolute; right:16px; bottom:16px; width:64px; height:64px; border-radius:50%; background:var(--brass); color:#1c1815; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.5); transition:transform .12s ease;}
  .cover:active .play{transform:scale(0.92);}
  .play svg{width:26px; height:26px;}
  .i-pause, .playing .i-play{display:none;}
  .playing .i-pause{display:block;}

  h1{font-family:var(--serif); font-weight:600; font-size:clamp(2.6rem, 12vw, 3.4rem); line-height:0.95; margin:26px 0 0; letter-spacing:-0.01em;}
  .artist{font-family:var(--mono); font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-dim); margin-top:10px;}

  .wave{display:flex; align-items:center; gap:2px; height:56px; margin-top:24px; cursor:pointer; touch-action:none;}
  .wave:focus-visible{outline:2px solid var(--brass); outline-offset:4px; border-radius:4px;}
  .wave i{flex:1; min-width:1px; border-radius:2px; background:var(--line); transition:background .15s ease;}
  .wave i.on{background:var(--brass);}
  .playing .wave i.head{background:var(--rust);}
  .times{display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.68rem; color:var(--ink-dim); margin-top:8px;}

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:26px;}
  .btn{font-family:var(--mono); font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; text-align:center; text-decoration:none; border-radius:6px; padding:13px 10px; border:1px solid var(--brass); cursor:pointer; background:transparent; color:var(--brass);}
  .btn.primary{background:var(--brass); color:var(--ground); font-weight:700;}
  .btn:hover{filter:brightness(1.08);}
  .note{font-family:var(--mono); font-size:0.64rem; color:var(--ink-dim); text-align:center; margin-top:22px; letter-spacing:0.03em;}
  .note a{color:var(--brass);}

<body>
<div class="ambient" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<main id="player">
  <div class="top">
    <a class="home" href="/">Garrett Summers</a>
    <span class="badge">Demo</span>
  </div>

  <button class="cover" type="button" aria-label="Play Tin Man">
    <img src="/images/tin-man-cover-lg.jpg" alt="Garrett Summers in sunglasses, mountains behind" width="1200" height="1200">
    <span class="play" aria-hidden="true">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
    </span>
  </button>

  <h1>Tin Man</h1>
  <div class="artist">Garrett Summers</div>

  <div class="wave" role="slider" tabindex="0" aria-label="Seek Tin Man" aria-valuemin="0" aria-valuemax="187" aria-valuenow="0"
       data-peaks="0.37,0.44,0.4,0.37,0.29,0.25,0.3,0.42,0.4,0.53,0.46,0.28,0.26,0.3,0.58,0.67,0.75,0.91,0.5,0.38,0.65,0.85,0.76,0.89,0.76,0.71,0.45,0.5,0.44,0.34,0.48,0.45,0.75,0.58,0.61,0.68,0.52,0.36,0.23,0.57,0.61,0.99,0.92,0.53,0.41,0.44,0.42,0.25,0.21,0.36,0.92,0.78,0.53,0.58,0.53,0.32,0.21,0.61,0.71,1.0,0.66,0.2,0.25,0.4,0.37,0.3,0.36,0.27,0.49,0.47,0.37,0.3,0.35,0.35,0.38,0.7,0.88,0.85,0.76,0.54,0.28,0.37,0.53,0.54,0.6,0.51,0.38,0.22,0.37,0.28,0.4,0.44,0.29,0.27,0.34,0.2"></div>
  <div class="times"><span class="t-cur">0:00</span><span class="t-dur">3:07</span></div>

  <div class="actions">
    <button class="btn primary share" type="button">Share</button>
    <a class="btn" href="/#book">Book Garrett</a>
  </div>
  <p class="note">More shows and music at <a href="/">garrettsummersmusic.com</a></p>
  <p class="note" style="margin-top:8px;opacity:0.75">&copy; &#8471; 2026 Garrett Summers. All rights reserved.</p>

  <audio preload="metadata" src="/audio/tin-man.m4a"></audio>
</main>

<script>
(function () {
  var root = document.getElementById('player');
  var audio = root.querySelector('audio'), btn = root.querySelector('.cover'), wave = root.querySelector('.wave');
  var cur = root.querySelector('.t-cur'), dur = root.querySelector('.t-dur'), share = root.querySelector('.share');
  var started = false, DUR = 187.4;
  var bars = wave.dataset.peaks.split(',').map(function (v) {
    var i = document.createElement('i'); i.style.height = Math.round(parseFloat(v) * 100) + '%'; wave.appendChild(i); return i;
  });
  function total() { return audio.duration || DUR; }
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function paint(t) {
    if (t == null) t = audio.currentTime;
    var n = Math.floor(t / total() * bars.length);
    bars.forEach(function (b, k) { b.classList.toggle('on', k < n); b.classList.toggle('head', k === n); });
    cur.textContent = fmt(t);
    wave.setAttribute('aria-valuenow', Math.floor(t));
  }
  function play() {
    audio.play();
    if (!started) { started = true; track('track_play', { track: 'Tin Man', page: 'demo' }); }
  }
  btn.addEventListener('click', function () { audio.paused ? play() : audio.pause(); });
  audio.addEventListener('play', function () { root.classList.add('playing'); btn.setAttribute('aria-label', 'Pause Tin Man'); });
  audio.addEventListener('pause', function () { root.classList.remove('playing'); btn.setAttribute('aria-label', 'Play Tin Man'); });
  audio.addEventListener('ended', function () { track('track_complete', { track: 'Tin Man', page: 'demo' }); audio.currentTime = 0; paint(0); });
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () { paint(); });

  function at(e) { var r = wave.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * total(); }
  var dragging = false;
  wave.addEventListener('pointerdown', function (e) { dragging = true; wave.setPointerCapture(e.pointerId); paint(at(e)); });
  wave.addEventListener('pointermove', function (e) { if (dragging) paint(at(e)); });
  wave.addEventListener('pointerup', function (e) {
    if (!dragging) return; dragging = false;
    audio.currentTime = at(e); if (audio.paused) play();
  });
  wave.addEventListener('keydown', function (e) {
    var d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); btn.click(); }
    if (d) { e.preventDefault(); audio.currentTime = Math.min(total(), Math.max(0, audio.currentTime + d)); paint(); }
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Tin Man (Demo)', artist: 'Garrett Summers',
      artwork: [{ src: location.origin + '/images/tin-man-cover-lg.jpg', sizes: '1200x1200', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
    navigator.mediaSession.setActionHandler('seekto', function (d) { audio.currentTime = d.seekTime; paint(); });
  }

  share.addEventListener('click', function () {
    var url = location.origin + '/demo/tin-man';
    track('track_share', { track: 'Tin Man', page: 'demo' });
    if (navigator.share) { navigator.share({ title: 'Tin Man (Demo) by Garrett Summers', url: url }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () {
      share.textContent = 'Link copied'; setTimeout(function () { share.textContent = 'Share'; }, 1800);
    }, function () {});
  });
  paint(0);
})();
</script>
